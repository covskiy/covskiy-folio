<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакты — Covskiy</title>
    <meta name="description" content="Как со мной связаться: telegram, почта, другие каналы." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/main.ts"></script>

  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Основная навигация">
        <a class="nav__brand" href="/">Covskiy</a>

    <main class="page">
      <section class="hero">
        <p class="hero__eyebrow">Контакты</p>
        <h1 class="hero__title">Как со мной связаться</h1>
        <p class="hero__lead">
          <!-- Замени на свои контакты -->
          Плейсхолдер: перечисли каналы связи. Самый быстрый ответ — чат-справка в правом нижнем
          углу или Telegram-бот.
        </p>

      <section class="cards" aria-label="Каналы связи">
        <article class="card">
          <h2 class="card__title">Telegram</h2>
          <p class="card__text">
            <a class="link" href="https://t.me/username">@username</a> — плейсхолдер
          </p>
        </article>
        <article class="card">
          <h2 class="card__title">Почта</h2>
          <p class="card__text">
            <a class="link" href="mailto:you@example.com">you@example.com</a> — плейсхолдер
          </p>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <span>© <span data-year></span> Covskiy</span>
      <a href="/contacts.html">Контакты</a>
